<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海龟汤 · 举石大冒险</title>
<style>
  :root{ --ink:#e8e6d9; --panel:#1c1730; --panel2:#2a2140; --accent:#ffcf4d;
         --danger:#ff5a5a; --good:#6ee27a; --line:#4a3f6b; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:#0d0a18; color:var(--ink);
    font-family:"DejaVu Sans Mono",Menlo,Consolas,monospace; }
  #app{ display:flex; height:100vh; gap:0; }
  /* left: scene */
  #scene{ flex:1 1 55%; position:relative; overflow:hidden;
    background:#120e22; border-right:4px solid #000; min-width:340px;
    image-rendering:pixelated; }
  #bg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    image-rendering:pixelated; opacity:.9; }
  #stage{ position:absolute; left:0; right:0; bottom:6%; display:flex;
    flex-direction:column; align-items:center; justify-content:flex-end; }
  #stack{ display:flex; flex-direction:column-reverse; align-items:center;
    margin-bottom:-8px; z-index:2; }
  .stone-row{ display:flex; justify-content:center; margin-bottom:-14px; }
  .stone-row img{ width:34px; height:34px; margin:0 -3px; image-rendering:pixelated;
    filter:drop-shadow(1px 2px 0 rgba(0,0,0,.45)); }
  #stack img{ image-rendering:pixelated; }
  #hero{ image-rendering:pixelated; transition:transform .4s ease, filter .4s;
    filter:drop-shadow(0 6px 0 rgba(0,0,0,.4)); z-index:1; }
  #hero.shake{ animation:shake .4s; }
  #hero.grow{ animation:growpop .7s ease; }
  @keyframes growpop{ 0%{transform:var(--sz) scale(.9)}
    40%{transform:var(--sz) scale(1.35)} 70%{transform:var(--sz) scale(.95)}
    100%{transform:var(--sz) scale(1)} }
  @keyframes shake{ 0%,100%{transform:var(--sz) translateX(0)}
    25%{transform:var(--sz) translateX(-6px)} 75%{transform:var(--sz) translateX(6px)} }
  #bubble{ position:absolute; top:6%; left:50%; transform:translateX(-50%);
    max-width:80%; background:#fff; color:#1a1a1a; padding:10px 14px; border-radius:10px;
    border:3px solid #000; font-size:14px; line-height:1.5; display:none; z-index:5;
    box-shadow:4px 4px 0 rgba(0,0,0,.4); }
  #bubble:after{ content:""; position:absolute; bottom:-14px; left:50%;
    transform:translateX(-50%); border:8px solid transparent; border-top-color:#000; }
  /* right: panel */
  #panel{ flex:1 1 45%; display:flex; flex-direction:column; background:var(--panel);
    min-width:320px; }
  header{ padding:12px 16px; background:var(--panel2); border-bottom:3px solid #000; }
  header h1{ margin:0; font-size:18px; color:var(--accent); letter-spacing:1px; }
  #stats{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; font-size:12px; }
  .stat{ background:#0d0a18; padding:4px 8px; border-radius:6px; border:1px solid var(--line); }
  .stat b{ color:var(--accent); }
  #hpwrap{ margin-top:8px; }
  #hpbar{ height:14px; background:#0d0a18; border:2px solid #000; border-radius:8px;
    overflow:hidden; }
  #hpfill{ height:100%; width:100%; background:linear-gradient(90deg,#6ee27a,#ffcf4d);
    transition:width .4s, background .4s; }
  #puzzle{ padding:12px 16px; background:#161226; border-bottom:2px solid var(--line);
    font-size:13px; line-height:1.6; }
  #puzzle .lbl{ color:var(--accent); font-weight:bold; }
  #log{ flex:1; overflow-y:auto; padding:12px 16px; display:flex; flex-direction:column;
    gap:8px; }
  .msg{ padding:8px 12px; border-radius:10px; max-width:88%; font-size:13px;
    line-height:1.5; white-space:pre-wrap; word-break:break-word; }
  .me{ align-self:flex-end; background:#3a2f5c; }
  .host{ align-self:flex-start; background:#241d3a; border:1px solid var(--line); }
  .sys{ align-self:center; font-size:12px; color:#9d95c0; font-style:italic; }
  .host.good{ border-color:var(--good); }
  .host.warn{ border-color:var(--accent); }
  .host.bad{ border-color:var(--danger); }
  #inputbar{ display:flex; gap:8px; padding:12px 16px; border-top:3px solid #000;
    background:var(--panel2); }
  #q{ flex:1; padding:10px 12px; border-radius:8px; border:2px solid var(--line);
    background:#0d0a18; color:var(--ink); font-family:inherit; font-size:14px; }
  #q:focus{ outline:none; border-color:var(--accent); }
  button{ font-family:inherit; font-weight:bold; cursor:pointer; border:2px solid #000;
    border-radius:8px; padding:10px 16px; font-size:14px; }
  #send{ background:var(--accent); color:#1a1a1a; }
  #next{ background:var(--good); color:#0d2a12; }
  #reveal{ background:#7a5a2a; color:var(--ink); }
  #newg{ background:#3a2f5c; color:var(--ink); }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  .hint{ font-size:11px; color:#9d95c0; padding:0 16px 8px; }
  /* truth modal */
  #modal{ position:fixed; inset:0; background:rgba(0,0,0,.72); display:none;
    align-items:center; justify-content:center; z-index:50; padding:20px; }
  #modal.show{ display:flex; }
  #modalbox{ background:var(--panel2); border:4px solid #000; border-radius:14px;
    max-width:520px; width:100%; padding:22px 24px; box-shadow:8px 8px 0 rgba(0,0,0,.5); }
  #modalbox h2{ margin:0 0 12px; color:var(--accent); font-size:20px; }
  #modaltruth{ font-size:15px; line-height:1.7; white-space:pre-wrap; }
  .modalwarn{ font-size:12px; color:#c9a24d; margin:14px 0 16px; }
  #modalclose{ background:var(--accent); color:#1a1a1a; width:100%; }
</style>
</head>
<body>
<div id="app">
  <div id="scene">
    <img id="bg" src="assets/bg.png" alt="">
    <div id="bubble"></div>
    <div id="stage">
      <img id="hero" src="assets/hero0.png" width="150" alt="角色">
    </div>
  </div>

  <div id="panel">
    <header>
      <h1>🐢 海龟汤 · 举石大冒险</h1>
      <div id="stats">
        <span class="stat">回合 <b id="s-round">0</b>/10</span>
        <span class="stat">石头 <b id="s-stone">0</b></span>
        <span class="stat">体型 <b id="s-size">Lv.0</b></span>
        <span class="stat">已解 <b id="s-solved">0</b></span>
      </div>
      <div id="hpwrap"><div id="hpbar"><div id="hpfill"></div></div></div>
    </header>
    <div id="puzzle"><span class="lbl">汤面：</span><span id="surface">加载中…</span></div>
    <div id="log"></div>
    <div class="hint">提问只能问「是/不是」类问题。想猜汤底就直接说出你的推理。</div>
    <div id="inputbar">
      <input id="q" placeholder="输入你的问题或猜测…" autocomplete="off">
      <button id="send">提问</button>
      <button id="next" style="display:none">下一题 ▶</button>
      <button id="reveal">看汤底</button>
      <button id="newg">新局</button>
    </div>
  </div>

  <div id="modal">
    <div id="modalbox">
      <h2>🥣 汤底</h2>
      <p id="modaltruth">…</p>
      <div class="modalwarn">看了汤底本局仍可继续，但就没有推理的乐趣啦～</div>
      <button id="modalclose">我知道了</button>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const log = $("#log"), q = $("#q"), send = $("#send"), newg = $("#newg"),
      next = $("#next");
let busy = false;

// ---- game rules (mirrors the backend's former constants) ----
const MAX_ROUND = 10;      // 10th stone crushes the mole
const GROW_WITHIN = 5;     // solve within 5 rounds => size +1

// ---- stateless client-side game state (the browser is the source of truth) ----
// size / solvedCount persist across reloads via localStorage.
const game = {
  surface: "", sealed: "", history: [],
  round: 0, stones: 0, status: "playing",
  size: Number(localStorage.getItem("ts_size") || 0),
  solvedCount: Number(localStorage.getItem("ts_solved") || 0),
  seen: [],           // recent surfaces, sent to /api/new to avoid repeats
};
let prefetched = null;  // {surface, sealed} pre-fetched for instant 下一题

function saveProgress(){
  localStorage.setItem("ts_size", String(game.size));
  localStorage.setItem("ts_solved", String(game.solvedCount));
}

function addMsg(text, cls){
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}
function bubble(text){
  const b = $("#bubble");
  b.textContent = text; b.style.display = "block";
  clearTimeout(bubble._t);
  bubble._t = setTimeout(()=> b.style.display = "none", 4200);
}
// each mole sprite already has its own boulders baked in, so no separate stack.
// pick the exact sprite for the current stone count (0..10).
function strainSprite(stones){
  const n = Math.max(0, Math.min(10, stones));
  return `assets/hero${n}.png`;
}
// render straight from the local `game` object.
function render(){
  $("#s-round").textContent = game.round;
  $("#s-stone").textContent = game.stones;
  $("#s-size").textContent = "Lv." + game.size;
  $("#s-solved").textContent = game.solvedCount;
  $("#surface").textContent = game.surface;
  // health drops as stones pile on toward 10
  const hp = Math.max(0, 100 - game.stones*10);
  const f = $("#hpfill");
  f.style.width = hp + "%";
  f.style.background = hp>50 ? "linear-gradient(90deg,#6ee27a,#ffcf4d)"
                    : hp>20 ? "#ffcf4d" : "#ff5a5a";
  // swap the mole sprite to match strain tier (unless crushed/over)
  const hero = $("#hero");
  if(game.status === "playing"){
    const want = strainSprite(game.stones);
    if(!hero.src.endsWith(want)) hero.src = want;
  }
  // size grows the hero; each stone makes him look more strained (crouch)
  const grow = 1 + game.size*0.22;
  const squash = 1 - Math.min(game.stones,10)*0.02;
  hero.style.setProperty("--sz", `scale(${grow}, ${grow*squash})`);
  hero.style.transform = `scale(${grow}, ${grow*squash})`;
  hero.style.filter = `drop-shadow(0 6px 0 rgba(0,0,0,.4)) brightness(${1-game.stones*0.04})`;
}
function crush(){
  const hero = $("#hero");
  hero.src = "assets/hero10.png";   // 10 stones, final crushed frame
  hero.style.transform = "scale(1.2)";
}

async function ask(question){
  if(busy) return;
  if(game.status !== "playing"){ return; }
  busy = true; send.disabled = true; q.disabled = true;
  addMsg(question, "me");
  const thinking = addMsg("……主持人思考中……", "sys");
  try{
    const r = await fetch("/api/ask", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        surface: game.surface, sealed: game.sealed,
        history: game.history, question,
      })});
    const d = await r.json();
    thinking.remove();
    if(d.error){ addMsg("出错了：" + d.error, "sys"); return; }
    // keep the model's conversational memory: append this turn to history
    game.history.push({role:"user", content:question});
    game.history.push({role:"assistant", content: d.raw ?? JSON.stringify(d)});

    if(d.type === "answer"){
      addMsg(d.reply, "host");
      game.round++; game.stones++;
      const hero = $("#hero"); hero.classList.remove("shake");
      void hero.offsetWidth; hero.classList.add("shake");
      if(game.round >= MAX_ROUND){
        game.status = "crushed";
        render(); crush();
        bubble("啊……被压扁了……");
        addMsg("💀 石头太多，角色被压倒了！汤底揭晓：" + (d.truth || await fetchTruth()), "host bad");
        addMsg("游戏结束。点「新局」重新开始（体型会重置）。", "sys");
        return;
      }
      render();
      bubble("咕…又一块石头 😣");
    } else if(d.type === "offtopic"){
      addMsg(d.reply, "host warn");
      render();   // round NOT consumed
    } else if(d.type === "solved"){
      addMsg("🎉 " + d.reply, "host good");
      const grew = game.round <= GROW_WITHIN;
      const solvedRound = game.round;
      if(grew) game.size++;
      game.solvedCount++;
      saveProgress();
      game.status = "solved";
      const hero = $("#hero");
      hero.src = "assets/hero0.png";   // put down the stones, celebrate
      render();
      if(grew){
        bubble(`答对啦！${solvedRound}回合内解开，我变强壮了！💪`);
        addMsg(`✨ 你在第 ${solvedRound} 回合内解开，角色体型 +1！`, "sys");
        hero.classList.remove("grow");
        void hero.offsetWidth; hero.classList.add("grow");
      } else {
        bubble("答对了！但用了超过5回合，体型没有增长。");
        addMsg("答对了！（超过5回合，体型未增长）", "sys");
      }
      addMsg("点「下一题 ▶」继续挑战（体型和已解会保留）。", "sys");
      enterSolved();     // stop here, wait for player to press 下一题
      return;            // skip the finally re-enable below
    }
  }catch(e){
    thinking.remove();
    addMsg("网络错误：" + e.message, "sys");
  }finally{
    if(!solvedWaiting){
      busy = false; send.disabled = false; q.disabled = false; q.focus();
    }
  }
}

async function fetchTruth(){
  try{
    const r = await fetch("/api/truth", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({sealed: game.sealed})});
    const d = await r.json();
    return d.truth || "";
  }catch(_){ return ""; }
}

// after a solve we pause: hide 提问, show 下一题, lock the input box.
let solvedWaiting = false;
function enterSolved(){
  solvedWaiting = true;
  busy = true;                       // block ask() until 下一题
  send.style.display = "none";
  next.style.display = "";
  next.disabled = false;
  q.disabled = true;
  q.placeholder = "本题已解开，点「下一题 ▶」继续…";
}
function exitSolved(){
  solvedWaiting = false;
  next.style.display = "none";
  send.style.display = "";
  q.disabled = false;
  q.placeholder = "输入你的问题或猜测…";
}

// fetch a fresh puzzle from /api/new (using a prefetched one if available).
async function fetchPuzzle(){
  if(prefetched){ const p = prefetched; prefetched = null; return p; }
  const r = await fetch("/api/new", {method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({seen: game.seen.slice(-6)})});
  const d = await r.json();
  if(d.error) throw new Error(d.error);
  return d;   // {surface, sealed}
}
// kick off background prefetch of the NEXT puzzle for instant switching.
function startPrefetch(){
  if(prefetched) return;
  fetch("/api/new", {method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({seen: game.seen.slice(-6)})})
    .then(r=>r.json()).then(d=>{ if(!d.error) prefetched = d; })
    .catch(()=>{});
}
// load a puzzle into game state and reset the per-puzzle counters.
function loadPuzzle(p){
  game.surface = p.surface;
  game.sealed = p.sealed;
  game.history = [];
  game.round = 0; game.stones = 0; game.status = "playing";
  game.seen.push(p.surface);
  $("#hero").src = "assets/hero0.png";
  render();
  startPrefetch();
}

async function nextPuzzle(){
  if(!solvedWaiting) return;
  next.disabled = true;
  addMsg("正在切换到下一题……", "sys");
  try{
    const p = await fetchPuzzle();   // size & solved count preserved (client state)
    log.innerHTML = "";
    loadPuzzle(p);
    addMsg("下一题来了！仔细读汤面，开始提问吧。", "sys");
  }catch(e){
    addMsg("切换失败：" + e.message, "sys");
    next.disabled = false;
    return;
  }
  exitSolved();
  busy = false; q.focus();
}

async function newGame(resetProgress){
  if(solvedWaiting) exitSolved();   // allow restart even while awaiting 下一题
  if(busy && !solvedWaiting) return;
  busy = true; send.disabled = true; newg.disabled = true;
  if(resetProgress){
    game.size = 0; game.solvedCount = 0; saveProgress();
  }
  log.innerHTML = "";
  addMsg("正在出题……", "sys");
  try{
    const p = await fetchPuzzle();
    log.innerHTML = "";
    loadPuzzle(p);
    addMsg("新的一局开始了！仔细读汤面，开始提问吧。", "sys");
  }catch(e){
    addMsg("开局失败：" + e.message, "sys");
  }finally{
    busy = false; send.disabled = false; newg.disabled = false; q.focus();
  }
}

send.onclick = ()=>{ const v=q.value.trim(); if(v){ q.value=""; ask(v);} };
q.addEventListener("keydown", e=>{ if(e.key==="Enter" && !q.disabled){ send.onclick(); }});
next.onclick = nextPuzzle;
newg.onclick = ()=>{
  if(confirm("确定要重新开始吗？体型和已解次数都会清零。")) newGame(true);
};

// reveal-truth modal
const reveal = $("#reveal"), modal = $("#modal");
reveal.onclick = async ()=>{
  reveal.disabled = true;
  try{
    const r = await fetch("/api/truth", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({sealed: game.sealed})});
    const d = await r.json();
    $("#modaltruth").textContent = d.truth || "（暂无汤底）";
    modal.classList.add("show");
  }catch(e){
    $("#modaltruth").textContent = "读取失败：" + e.message;
    modal.classList.add("show");
  }finally{ reveal.disabled = false; }
};
$("#modalclose").onclick = ()=> modal.classList.remove("show");
modal.addEventListener("click", e=>{ if(e.target===modal) modal.classList.remove("show"); });

// boot — keep any size/solved progress saved from a previous visit
newGame(false);
</script>
</body>
</html>
